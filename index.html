<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>斗战者控制台</title>
  <script>window.onerror=function(m,u,l,c,e){var d=document,r=d.getElementById("root");if(!r)return;r.innerHTML="<div style=\"padding:40px;font-family:system-ui;color:#ff6b6b\"><h2 style=\"margin:0 0 12px;font-size:20px\">⚠ 页面渲染错误</h2><pre style=\"margin:0;padding:16px;background:#1b1b22;border-radius:8px;color:#f4f4f7;font-size:13px;overflow:auto;border:1px solid rgba(244,244,247,0.12)\">"+((e&&e.message)||m).replace(/</g,"&lt;")+"</pre></div>"};window.addEventListener("unhandledrejection",function(e){var d=document,r=d.getElementById("root");if(!r)return;r.innerHTML="<div style=\"padding:40px;font-family:system-ui;color:#ff6b6b\"><h2 style=\"margin:0 0 12px;font-size:20px\">⚠ 未捕获的 Promise 错误</h2><pre style=\"margin:0;padding:16px;background:#1b1b22;border-radius:8px;color:#f4f4f7;font-size:13px;overflow:auto;border:1px solid rgba(244,244,247,0.12)\">"+(e.reason&&e.reason.message||String(e.reason)).replace(/</g,"&lt;")+"</pre></div>"});</script></head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
