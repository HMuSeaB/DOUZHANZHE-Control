name: 编译与打包发布 (Build & Release)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 构建与测试
    runs-on: windows-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 运行前端测试
        run: npm test

      - name: 构建后端
        run: dotnet build server/api/Douzhanzhe.API.csproj --nologo

      - name: 运行后端测试
        run: dotnet test tests/Douzhanzhe.Api.Tests/Douzhanzhe.Api.Tests.csproj --nologo

  build-and-release:
    name: 打包与发布
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Inno Setup 打包器 (Choco)
        run: choco install innosetup -y

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
              Write-Host "::error::tag 版本 $tagVersion 与 package.json 版本 $pkgVersion 不一致"
              exit 1
          }
          Write-Host "版本一致: $pkgVersion"

      - name: 安装前端依赖
        run: npm ci

      - name: 适配配置并运行打包构建
        shell: pwsh
        run: |
          $issFile = "installer/douzhanzhe-setup.iss"
          if (Test-Path $issFile) {
              $issContent = Get-Content $issFile -Raw
              $issContent = $issContent -replace 'd:\\DOUZHANZHE-Control', $pwd.Path
              [System.IO.File]::WriteAllText((Resolve-Path $issFile).Path, $issContent, (New-Object System.Text.UTF8Encoding($false)))
          }
          New-Item -ItemType Directory -Force -Path "server/api/wwwroot"
          New-Item -ItemType Directory -Force -Path "server/api/bin/build/wwwroot"
          cd installer
          $ISCC_Path = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          .\build-installer.ps1 -ISCC $ISCC_Path

      - name: 创建免安装绿色版 ZIP 压缩包 (Portable Zip)
        shell: pwsh
        run: Compress-Archive -Path "dist/publish/api/*" -DestinationPath "dist/installer/Douzhanzhe-Console-Portable.zip" -Force

      - name: 上传构建产物至 Actions (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Douzhanzhe-Console-Builds
          path: |
            dist/installer/*.exe
            dist/installer/*.zip

      - name: 自动发布到 GitHub Release (仅在推送 v* Tag 时触发)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/*.exe
            dist/installer/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
