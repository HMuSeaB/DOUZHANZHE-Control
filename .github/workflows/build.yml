name: 编译与打包发布 (Build & Release)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch: # 支持在 GitHub 页面手动点击运行

permissions:
  contents: write # 赋予 Actions 写入和发布 Release 的权限

jobs:
  # 快速校验：每次推送与 PR 都跑，几分钟内给出反馈。
  # 不装 Inno Setup、不做发布，避免为一次普通提交付出完整打包的时间。
  test:
    name: 构建与测试
    runs-on: windows-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 按 package-lock.json 精确安装依赖，保证构建可复现
      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 运行前端测试
        run: npm test

      - name: 构建后端
        run: dotnet build server/api/Douzhanzhe.API.csproj --nologo

      - name: 运行后端测试
        run: dotnet test tests/Douzhanzhe.Api.Tests --nologo

  # 打包发布：仅在推送 v* Tag 或手动触发时运行，且必须先通过上面的校验。
  build-and-release:
    name: 打包与发布
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Inno Setup 打包器 (Choco)
        run: |
          choco install innosetup -y

      # 安装包版本号取自 package.json，而发布由 git tag 触发。
      # 两者不一致会让 vX.Y.Z 的 Release 挂上另一个版本号的安装包。
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $pkgVersion) {
              Write-Host "::error::tag 版本 $tagVersion 与 package.json 版本 $pkgVersion 不一致，请先运行 installer/sync_version.py $tagVersion 并提交"
              exit 1
          }
          Write-Host "版本一致: $pkgVersion"

      # 按 package-lock.json 精确安装依赖，保证构建可复现
      - name: 安装前端依赖
        run: npm ci

      - name: 适配配置并运行打包构建
        shell: pwsh
        run: |
          # 1. 自动修正 Inno Setup 配置文件 (.iss) 里的硬编码 Root 路径，指代为虚拟机当前工作路径
          $issFile = "installer/douzhanzhe-setup.iss"
          if (Test-Path $issFile) {
              $issContent = Get-Content $issFile -Raw
              $issContent = $issContent -replace 'd:\\DOUZHANZHE-Control', $pwd.Path
              [System.IO.File]::WriteAllText((Resolve-Path $issFile).Path, $issContent, (New-Object System.Text.UTF8Encoding($false)))
          }

          # 2. 提前在源目录及运行目录中创建 wwwroot 文件夹，确保 deploy.ps1 复制成功且 dotnet publish 能顺利打包前端资源
          New-Item -ItemType Directory -Force -Path "server/api/wwwroot"
          New-Item -ItemType Directory -Force -Path "server/api/bin/build/wwwroot"

          # 3. 调用项目的打包安装脚本
          cd installer
          $ISCC_Path = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          .\build-installer.ps1 -ISCC $ISCC_Path

      - name: 创建免安装绿色版 ZIP 压缩包 (Portable Zip)
        shell: pwsh
        run: |
          # 将编译好的完整绿色二进制文件夹打包压缩
          Compress-Archive -Path "dist/publish/api/*" -DestinationPath "dist/installer/Douzhanzhe-Console-Portable.zip" -Force

      - name: 上传构建产物至 Actions (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Douzhanzhe-Console-Builds
          path: |
            dist/installer/*.exe
            dist/installer/*.zip

      - name: 自动发布到 GitHub Release (仅在推送 v* Tag 时触发)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/installer/*.exe
            dist/installer/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
